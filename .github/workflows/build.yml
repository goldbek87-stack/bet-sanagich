name: Build EXE
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pypdf pyinstaller
      - run: pyinstaller --onefile --name BetSanagich bet_sanagich.py
      - uses: actions/upload-artifact@v4
        with:
          name: BetSanagich-exe
          path: dist/BetSanagich.exe
